# The same checks as .github/workflows/test.yml, on x86_64 Linux, which is
# all these runners are; GitHub covers aarch64 Linux and macOS. This one also
# fills the Nix cache from `main`.
#
# Forgejo reads workflows from the first of .forgejo/workflows,
# .gitea/workflows and .github/workflows that exists, so this directory is
# also what keeps it from trying to run the GitHub workflow on runners that
# have none of GitHub's labels.

name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: nixos-do-s
    enable-openid-connect: true
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check REUSE compliance
        run: nix develop -c reuse lint

      - name: Check Zig formatting compliance
        run: nix develop -c zig fmt --check .

      - name: Test
        run: nix develop -c zig build test --summary all

      - name: Test under valgrind
        run: nix develop -c zig build test-valgrind

      - name: Build
        run: nix develop -c zig build

      - name: Build the package
        run: nix build -L .#zon2nix

      # Needs the network: it fetches every package in tests/e2e, builds the
      # expression zon2nix writes for them, and checks each against `zig
      # fetch`.
      - name: Test from end to end
        run: nix develop -c tests/e2e/check.sh

      - name: Push to the cache
        if: ${{ !cancelled() && forge.ref == 'refs/heads/main' }}
        uses: https://git.jcollie.dev/jeff/niks3-push@3f85f501658e379783381291241c6f8315a92716
        with:
          server-url: https://niks3.jcollie.dev
